site_name: Blood Bowl · My Rosters
site_description: Referencia de Blood Bowl Temporada 3 (BB2025) en español para consultar durante el partido
site_url: https://asantolaria.github.io/bloodbowl-my-rosters/
repo_url: https://github.com/asantolaria/bloodbowl-my-rosters
repo_name: asantolaria/bloodbowl-my-rosters
edit_uri: ""

docs_dir: docs
exclude_docs: |
  *.pdf
  *.py
  source/README.md
  source/images/README.md
  rosters/limite-valoracion/

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets

plugins:
  - search:
      lang: es

validation:
  links:
    anchors: warn

